name: PR. Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    env:
      Solution_Name: TraduSaga.sln
      
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0

    - name: Set up .NET 8
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: 8.0.x

    - name: Scan for committed secrets
      shell: pwsh
      run: |
        $version = '8.30.1'
        $archiveName = "gitleaks_${version}_windows_x64.zip"
        $archive = Join-Path $env:RUNNER_TEMP $archiveName
        $expectedHash = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
        $url = "https://github.com/gitleaks/gitleaks/releases/download/v$version/$archiveName"
        Invoke-WebRequest -Uri $url -OutFile $archive
        $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualHash -ne $expectedHash) {
          throw 'Gitleaks archive SHA-256 did not match the pinned release digest.'
        }
        $toolDirectory = Join-Path $env:RUNNER_TEMP 'gitleaks'
        Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory
        & (Join-Path $toolDirectory 'gitleaks.exe') detect --source . --redact --exit-code 1

    - name: Restore locked dependencies and audit
      run: dotnet restore $env:Solution_Name --locked-mode

    - name: Report vulnerable packages
      run: dotnet list $env:Solution_Name package --vulnerable --include-transitive

    - name: Run security tests
      run: dotnet test tests\TraduSaga.Security.Tests\TraduSaga.Security.Tests.csproj --configuration Release --no-restore -p:SkipPredictionModelCopy=true

    - name: Build Release
      run: dotnet build $env:Solution_Name --configuration Release --no-restore -p:SkipPredictionModelCopy=true
